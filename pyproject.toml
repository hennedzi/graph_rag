[project]
name = "graph-rag"
version = "0.1.0"
description = "Graph RAG: ETL + API + Harness на Milvus"
requires-python = ">=3.11"
dependencies = [
    "pymilvus[milvus_lite]>=2.5",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "prometheus_client>=0.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
