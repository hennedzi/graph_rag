[llm]
url = http://127.0.0.1:8888/v1
api_key = sk-unsloth-YOUR_KEY
model = unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL
; 0.0 — детерминированно и сухо; 0.3 — живее формулировки, развёрнутее ответы
temperature = 0.3

[embeddings]
url = http://127.0.0.1:8001/v1
model = bge-m3
dimension = 1024
batch = 64

[reranker]
url = http://127.0.0.1:8081/v1
model = bge-reranker-v2-m3

[milvus]
; Milvus Lite: файл открывает один процесс. ETL смонтирован в api.py, CLI запускать при остановленном сервере.
uri = ./graph_rag.db
collection = graph_rag

[search]
top_entities = 5
top_relations = 5
passage_hits = 10
rerank_candidates = 20
top_passages = 5
; llama.cpp-реранкер отдаёт логиты, порог 1.0 — из AI_diplom
min_rerank_score = 1.0
rrf_k = 60

[etl]
; реранкер в compose AI_diplom с ctx 512 токенов: ~1000 символов + вопрос помещаются
chunk_chars = 1000
extract_concurrency = 4
max_upload_mb = 10

[harness]
max_steps = 8
; бюджет окна LLM в токенах на весь диалог (реальный usage.prompt_tokens);
; автоматически урезается до n_ctx llama-server (/props) минус 2048 под ответ
budget_tokens = 64000
preview_chars = 160
fix_rounds = 1
# required — модель обязана звать инструмент (финал только через answer); auto — если сервер не умеет required
tool_choice = required
fast_path_threshold = 0.8
cache_ttl = 300
# длина строки хода мыслей harness в логе; 0 — выключить
log_chars = 400

[logging]
level = INFO
file = logs/graph_rag.log
runs_dir = runs
